[package]
name = "pigeon"
version = "0.3.0"
description = "Pigeon — a one-view, multi-engine coding-agent session console."
authors = ["IntAnalytic"]
edition = "2021"

[lib]
name = "pigeon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# PTY runtime for the embedded terminal. The engine CLIs are resolved off PATH at spawn
# time and are NEVER bundled or vendored.
portable-pty = "0.9"
base64 = "0.22"

# OpenCode's session store is SQLite. `bundled` so a fresh clone needs no system libsqlite3.
rusqlite = { version = "0.32", features = ["bundled"] }

# Claude's capacity endpoint. `default-features = false` because the default feature set drags
# in native-tls; rustls keeps the build self-contained.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

dirs = "5"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
